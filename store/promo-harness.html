<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Promo tile harness</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 440px;
        height: 280px;
        background: #f8fafc;
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .tile {
        width: 440px;
        height: 280px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f8fafc;
      }
      img {
        width: 96px;
        height: 96px;
      }
      .name {
        font-size: 22px;
        font-weight: 700;
        color: #1f2937;
        text-align: center;
        line-height: 1.25;
      }
      .unofficial {
        font-size: 14px;
        font-weight: 500;
        color: #6b7280;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <img src="../icons/icon128.png" alt="">
      <div class="name">Session Keeper for eRA Commons</div>
      <div class="unofficial">unofficial</div>
    </div>
  </body>
</html>
