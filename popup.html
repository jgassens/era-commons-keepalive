<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>eRA Commons Keep Alive</title>
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; min-width: 260px; color: #1f2937; }
      h1 { font-size: 16px; margin: 0 0 14px; }
      label { display: flex; align-items: center; gap: 8px; font-weight: 600; }
      input { width: 18px; height: 18px; }
      dl { margin: 16px 0 0; }
      dt { font-weight: 600; margin-top: 8px; }
      dd { margin: 1px 0 0; color: #4b5563; }
    </style>
  </head>
  <body>
    <h1>eRA Commons Keep Alive</h1>
    <label><input id="enabled" type="checkbox"> Keep session active</label>
    <dl>
      <dt>Status</dt><dd id="status">Loading…</dd>
      <dt>Last successful ping</dt><dd id="last-ping">Never</dd>
      <dt>Last continued warning</dt><dd id="last-click">Never</dd>
    </dl>
    <script src="popup.js"></script>
  </body>
</html>
